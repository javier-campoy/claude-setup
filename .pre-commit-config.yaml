# Pre-commit hooks.
# Instala con:
#   uv run pre-commit install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
# Ejecuta manualmente sobre todos los ficheros:
#   uv run pre-commit run --all-files

repos:
  # ---------------------------------------------------------------------------
  # Checks básicos de ficheros
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: mixed-line-ending

  # ---------------------------------------------------------------------------
  # Secrets scanning: detecta tokens, API keys, connection strings, etc.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ---------------------------------------------------------------------------
  # Lint + format
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        # Markdown incluido: ruff formatea los bloques ```python de docs/ y CI hace
        # `ruff format --check .` sobre todo el repo.
        types_or: [python, pyi, jupyter, markdown]

  # ---------------------------------------------------------------------------
  # Type checking
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [pytest]
        args: [--config-file=pyproject.toml]
        files: ^src/

  # ---------------------------------------------------------------------------
  # Hooks locales
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      # -----------------------------------------------------------------------
      # Protección de main: bloquea commits directos en main/master.
      # Trabaja siempre en ramas feat/..., fix/..., etc.
      # -----------------------------------------------------------------------
      - id: protect-main-branch
        name: proteger rama main
        entry: bash .claude/hooks/protect-main-branch.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # -----------------------------------------------------------------------
      # Documentación viva: BLOQUEA si tocas src/ sin actualizar docs/.
      # Ejecuta /state y /changelog antes de commitear.
      # -----------------------------------------------------------------------
      - id: docs-sync-check
        name: docs viva sincronizada
        entry: bash .claude/hooks/docs-sync-check.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # -----------------------------------------------------------------------
      # Cobertura de documentación: BLOQUEA si el código staged no está
      # documentado (docstrings públicos, docs/modules/<modulo>.md y la sección
      # [No publicado] del changelog). Backstop determinista de la auditoría que
      # la skill /commit hace (y auto-remedia) antes de llegar aquí.
      # -----------------------------------------------------------------------
      - id: doc-coverage
        name: cobertura de documentación
        entry: uv run python .claude/hooks/check_doc_coverage.py --staged
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # -----------------------------------------------------------------------
      # Conventional Commits: valida el formato del mensaje de commit.
      # Formato: <tipo>[(<scope>)][!]: <resumen> (máx 72 chars)
      # Tipos: feat fix docs refactor test chore perf ci build revert
      # -----------------------------------------------------------------------
      - id: conventional-commits
        name: conventional commits
        entry: bash .claude/hooks/conventional-commits.sh
        language: system
        stages: [commit-msg]

      # -----------------------------------------------------------------------
      # Gate de calidad pre-push: ruff + mypy + pytest deben pasar antes
      # de subir nada al remoto. Usa --no-verify solo en emergencias justificadas.
      # -----------------------------------------------------------------------
      - id: pre-push-quality-gate
        name: gate de calidad (pre-push)
        entry: bash .claude/hooks/pre-push-quality-gate.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
